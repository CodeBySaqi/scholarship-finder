name: keepalive
# Render Free sleeps a service after 15 min idle, and Supabase Free pauses a
# project after 7 days without database activity. One hit a day to /api/health
# cold-starts the app (which reads the app_state row) and keeps both awake.
on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Hit the health endpoint
        run: |
          URL="https://scholarship-finder-5g4o.onrender.com/api/health"
          for i in 1 2 3 4 5 6; do
            code=$(curl -s -o /tmp/h.json -w "%{http_code}" --max-time 90 "$URL" || echo 000)
            echo "attempt $i -> HTTP $code"
            if [ "$code" = "200" ]; then cat /tmp/h.json; exit 0; fi
            sleep 20
          done
          echo "health check did not recover"; exit 1

name: deploy
# Builds production on every push to main.
#
# Why this workflow exists: this Render service was created through the Render
# API, which does not install Render's GitHub webhook, so the service's own
# `autoDeploy` setting has nothing to fire on. Until the repo is connected in the
# Render dashboard, this workflow is the webhook.
#
# Auth: the Render Deploy Hook URL for the service, stored as the repository
# secret RENDER_DEPLOY_HOOK (Render -> service -> Settings -> Deploy Hook).
# It is a credential: never paste it into a file in this repo.
# RENDER_API_KEY is accepted as a fallback if you would rather deploy by API key.
on:
  push:
    branches: [main]
  workflow_dispatch:
concurrency:
  group: deploy-main
  cancel-in-progress: false
jobs:
  render:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger the Render deploy
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          SERVICE_ID: srv-dbdk3559fdbs73bdghrg
          COMMIT: ${{ github.sha }}
        run: |
          set -e
          if [ -n "$RENDER_DEPLOY_HOOK" ]; then
            echo "Deploying via deploy hook"
            code=$(curl -s -o /tmp/d.json -w "%{http_code}" --max-time 60 -X POST "$RENDER_DEPLOY_HOOK")
            echo "HTTP $code"; cat /tmp/d.json || true
            [ "$code" = "200" ] || [ "$code" = "201" ]
          elif [ -n "$RENDER_API_KEY" ]; then
            echo "Deploying via Render API for commit $COMMIT"
            code=$(curl -s -o /tmp/d.json -w "%{http_code}" --max-time 60 \
              -X POST "https://api.render.com/v1/services/$SERVICE_ID/deploys" \
              -H "Authorization: Bearer $RENDER_API_KEY" \
              -H "Content-Type: application/json" \
              -d "{\"commitId\":\"$COMMIT\",\"clearCache\":\"do_not_clear\"}")
            echo "HTTP $code"; cat /tmp/d.json || true
            [ "$code" = "201" ] || [ "$code" = "200" ]
          else
            echo "::error::No deploy credential. Add RENDER_DEPLOY_HOOK (or RENDER_API_KEY) in Settings > Secrets and variables > Actions."
            exit 1
          fi
